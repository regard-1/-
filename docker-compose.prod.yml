services:
  dotbest-ops-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: dotbest-ops-app
    restart: unless-stopped
    environment:
      STUDIO_LLM_API_KEY: ${STUDIO_LLM_API_KEY}
      STUDIO_LLM_BASE_URL: ${STUDIO_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      STUDIO_VISION_MODEL: ${STUDIO_VISION_MODEL}
      BAILIAN_KB_API_KEY: ${BAILIAN_KB_API_KEY}
      BAILIAN_KB_BASE_URL: https://ws-5ir7z45ox2wmnbb4.cn-beijing.maas.aliyuncs.com
      BAILIAN_KB_AGENT_ID: aid-56fd229f52354d75af21e38ee208fa8a
      BAILIAN_KB_TOP_K: "5"
      WECOM_API_BASE: https://stride-bg.dpclouds.com/hub-api
      WECOM_API_TOKEN: ${WECOM_API_TOKEN}
      WECOM_API_TIMEOUT_MS: "15000"
      IDP_CLIENT_ID: ${IDP_CLIENT_ID}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}
      IDP_REDIRECT_URI: ${IDP_REDIRECT_URI}
      IDP_EMAIL_DOMAIN: ${IDP_EMAIL_DOMAIN}
      IDP_ORG_ID: ${IDP_ORG_ID}
      SP_BASE_URL: ${SP_BASE_URL}
      SP_SSO_PATH: ${SP_SSO_PATH}
      SP_REDIRECT_PATH: ${SP_REDIRECT_PATH:-/main/:orgId/member-crm/:groupId/contact-list}
      SP_ALLOWED_ORIGIN: ${SP_ALLOWED_ORIGIN}
      STUDIO_DATA_DIR: /data
      STUDIO_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - dotbest-ops-data:/data
    ports:
      - "127.0.0.1:8300:3000"
    networks:
      - pdp-release_default

volumes:
  dotbest-ops-data:

networks:
  pdp-release_default:
    external: true
