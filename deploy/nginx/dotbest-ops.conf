# Dotbest Ops location blocks - included from pdp.conf server block
# Placed before location / to take priority over the catch-all

location = /dotbest-ops {
    return 301 /dotbest-ops/;
}

location /dotbest-ops/ {
    proxy_pass http://dotbest-ops-app:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '/api/studio' '/dotbest-ops/api/studio';
    sub_filter '/api/v1' '/dotbest-ops/api/v1';
    sub_filter '/api/login' '/dotbest-ops/api/login';
    sub_filter '/api/logout' '/dotbest-ops/api/logout';
    sub_filter '/api/me' '/dotbest-ops/api/me';
    sub_filter '/script-studio/' '/dotbest-ops/script-studio/';
    sub_filter '="/script-studio' '="/dotbest-ops/script-studio';
    sub_filter 'href="/script-studio' 'href="/dotbest-ops/script-studio';
    sub_filter 'src="/script-studio' 'src="/dotbest-ops/script-studio';

    proxy_cookie_path ~^/(.*)$ /dotbest-ops/$1;
    proxy_redirect ~^/(script-studio|api|index)(.*)$ /dotbest-ops/$1$2;
    proxy_redirect ~^/$ /dotbest-ops/;
}
